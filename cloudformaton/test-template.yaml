AWSTemplateFormatVersion: '2010-09-09'
Description: 'FCS Test Lab - Intentionally misconfigured for IaC scanning'

Resources:
  # Intentionally misconfigured S3 bucket to trigger IaC findings
  InsecureS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: fcs-test-insecure-bucket
      AccessControl: PublicRead          # Should trigger finding
      VersioningConfiguration:
        Status: Suspended                # Should trigger finding

  # Intentionally misconfigured security group
  InsecureSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Insecure Security Group'
      SecurityGroupIngress:
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'           # Should trigger finding
